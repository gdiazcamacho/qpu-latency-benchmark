[project]
name = "qpu-latency-benchmark"
version = "0.1.0"
description = "Benchmark suite for characterizing latency and overheads in quantum computing platforms."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Guillermo Díaz Camacho", email = "gdiaz@cesga.es"},
]
keywords = ["quantum computing", "benchmarking", "latency", "HPC", "QPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "qiskit>=1.2",
    "qiskit-aer",
]

[project.optional-dependencies]
# OpenQASM/QIR serialization timing (--ir-formats qir)
qir = ["qiskit-qir"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/gdiazcamacho/qpu-latency-benchmark"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latency_benchmark*"]
