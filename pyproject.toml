[project]
name = "qpu-latency-benchmark"
version = "0.1.0"
description = "Benchmark suite for characterizing latency and overheads in quantum computing platforms."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "qiskit",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latency_benchmark*"]
