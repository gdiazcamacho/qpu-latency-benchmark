experiment_name: shot_scaling_qmio
experiment_type: shot_scaling
backend: qmio
output_db: output/db/timing_results.sqlite

sweep:
  shots: [10, 100, 1000, 10000, 100000]

controls:
  n_circuits: 1
  depth: 4
  n_qubits: 2
  circuit_family: single_qubit_layers

repetitions: 3
randomize_order: true

backend_options:
  # If null, the latest file in calibration_dir is used automatically.
  calibration_file: null
  calibration_dir: /opt/cesga/qmio/hpc/calibrations

