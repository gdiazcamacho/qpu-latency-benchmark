experiment_name: timing_matrix_qmio
backend: qmio

output_db: output/db/timing_results.sqlite

matrix:
  n_circuits: [1, 2, 4, 8, 16, 32]
  depths: [0, 1, 2, 4, 8, 16]
  shots: [1000]
  n_qubits: [2]
  repetitions: 1
  circuit_family: single_qubit
  randomize_order: true

backend_options:
  # If null, the latest file in calibration_dir is used automatically.
  calibration_file: null
  calibration_dir: /opt/cesga/qmio/hpc/calibrations
