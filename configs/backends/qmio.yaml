backend: qmio
output_db: output/db/timing_results.sqlite
backend_options:
  # If null, the latest file in calibration_dir is used automatically.
  calibration_file: null
  calibration_dir: /opt/cesga/qmio/hpc/calibrations
  # Explicit and matching configs/backends/qexa20.yaml's value -- see
  # orchestrator.py's _run_point_batched comment for why this matters:
  # comparing transpiled depth across backends is only meaningful if both
  # use the same optimization_level.
  optimization_level: 0
  seed_transpiler: 42
  # Format actually submitted over the wire: qasm2 (default) or qasm3.
  # QmioBackend.run() honours this via output_qasm3, and the choice
  # measurably changes real submission time (QASM3 measured ~3x slower
  # than QASM2 at ~600-gate depth on QMIO hardware, with the gap widening
  # as circuits grow). Leave unset for the client library's own default,
  # which is qasm2. Override per-run with --wire-format.
  # Note: QIR is NOT selectable here -- QMIO accepts QIR only via a
  # different submission path (QmioRuntimeService + qiskit_qir bitcode),
  # which would need its own adapter.
  wire_format: qasm2