experiment_name: batch_scaling_qmio
experiment_type: batch_scaling
backend: qmio
output_db: output/db/timing_results.sqlite

sweep:
  n_circuits: [1, 2, 4, 8, 16, 32]

controls:
  depth: 4
  shots: 1000
  n_qubits: 2
  circuit_family: single_qubit_layers

repetitions: 3
randomize_order: true

backend_options:
  calibration_file: null
  logging_level: 20
  qmio_partition: full
